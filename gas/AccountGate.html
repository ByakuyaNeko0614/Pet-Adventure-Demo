  <section class="account-gate" id="account-gate" aria-labelledby="account-title">
    <div class="account-card">
      <span class="brand-icon" aria-hidden="true">✦</span>
      <h1 id="account-title">寵物尋寶</h1>
      <p>登入後，回到你自己的寵物窩。</p>
      <form id="account-form" hidden>
        <label for="account-username">帳號名稱</label>
        <input id="account-username" autocomplete="username" maxlength="24" required>
        <label for="account-password">密碼</label>
        <input id="account-password" type="password" autocomplete="current-password" minlength="15" maxlength="256" required aria-describedby="account-password-help">
        <small id="account-password-help">至少 15 個字元，可使用一段好記的短句。</small>
        <button class="button" id="account-submit" type="submit">登入</button>
        <button id="account-mode" type="button">第一次來？建立帳號</button>
      </form>
      <p id="account-message" role="status"></p>
      <a class="button" id="account-return" href="?page=PAGE_ROUTE" hidden>回登入畫面</a>
    </div>
  </section>
